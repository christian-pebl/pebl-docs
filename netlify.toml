[build]
  command = "npm run build"
  publish = "build"
  # Skip a production build that cannot change the site (11 Nov 2026: the free plan's 300 monthly credits, shared
  # with www, ran out; each production deploy costs 15). Skips only when every changed file is CLAUDE.md, README.md,
  # .gitignore, .github/ or tests/. Previews, empty commits and same-commit rebuilds always build.
  # Proof: tests/netlify_ignore_check.sh.
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  # Node 20 reached end of life on 30 April 2026. Node 22 is the version the main website builds with.
  NODE_VERSION = "22"

# Security headers on every response, matching the main website (www.pebl-cic.co.uk) where they apply.
# The CSP sets only framing, plugin, base and form rules, so it cannot block Docusaurus's own inline scripts
# or the local search. Netlify already sends Strict-Transport-Security.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"

# The docs live at www.pebl-cic.co.uk/docs/ (Christian, 11 Nov 2026): the website proxies /docs/* to this site. So every
# redirect target is a full www address; a relative one, answered through the proxy, would land on a website page.
# Every page URL ends with a slash (trailingSlash: true in docusaurus.config.js), so each redirect target does too,
# and an old path reaches its page in one hop. The bare folder forms come before their splat rules, so an empty
# splat never builds a double slash.
[[redirects]]
  from = "/docs"
  to = "https://www.pebl-cic.co.uk/docs/"
  status = 301
  force = true

[[redirects]]
  from = "/docs/"
  to = "https://www.pebl-cic.co.uk/docs/"
  status = 301
  force = true

[[redirects]]
  from = "/docs/*"
  to = "https://www.pebl-cic.co.uk/docs/:splat"
  status = 301
  force = true

