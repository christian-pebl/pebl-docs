[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 301
  force = true

# Mooring Guide relocated under /mooring-guide (User Guide now at root)
[[redirects]]
  from = "/camera-configuration"
  to = "/mooring-guide/camera-configuration"
  status = 301

[[redirects]]
  from = "/frame-configurations"
  to = "/mooring-guide/frame-configurations"
  status = 301

[[redirects]]
  from = "/frame-configurations/*"
  to = "/mooring-guide/frame-configurations/:splat"
  status = 301

# Legacy /moorings paths
[[redirects]]
  from = "/moorings"
  to = "/mooring-guide/frame-configurations/"
  status = 301

[[redirects]]
  from = "/moorings/"
  to = "/mooring-guide/frame-configurations/"
  status = 301

[[redirects]]
  from = "/moorings/*"
  to = "/mooring-guide/frame-configurations/:splat"
  status = 301
