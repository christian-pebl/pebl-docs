[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 301
  force = true

# SubCam guide moved under /subcam (hub landing now at root)
[[redirects]]
  from = "/hardware"
  to = "/subcam/hardware"
  status = 301

[[redirects]]
  from = "/connect-and-configure"
  to = "/subcam/connect-and-configure"
  status = 301

[[redirects]]
  from = "/operating"
  to = "/subcam/operating"
  status = 301

[[redirects]]
  from = "/specification"
  to = "/subcam/specification"
  status = 301

[[redirects]]
  from = "/maintenance"
  to = "/subcam/maintenance"
  status = 301

[[redirects]]
  from = "/mounting"
  to = "/subcam/mounting"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/subcam/faq"
  status = 301

# Mooring Guide relocated under /mooring-guide
[[redirects]]
  from = "/camera-configuration"
  to = "/mooring-guide/camera-configuration"
  status = 301

[[redirects]]
  from = "/frame-configurations"
  to = "/mooring-guide/frame-configurations"
  status = 301

[[redirects]]
  from = "/frame-configurations/*"
  to = "/mooring-guide/frame-configurations/:splat"
  status = 301

# Legacy /moorings paths
[[redirects]]
  from = "/moorings"
  to = "/mooring-guide/frame-configurations/"
  status = 301

[[redirects]]
  from = "/moorings/"
  to = "/mooring-guide/frame-configurations/"
  status = 301

[[redirects]]
  from = "/moorings/*"
  to = "/mooring-guide/frame-configurations/:splat"
  status = 301
